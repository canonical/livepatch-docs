<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title description">
  <title id="title">Livepatch on-premises server security architecture</title>
  <desc id="description">Dashed boxes separate the client network, administrator network, server deployment, upstream services, data services, management, and observability. Client and admin requests reach an optional TLS-terminating proxy, then the server over trusted HTTP. The server accesses upstream patch and Ubuntu Pro services, PostgreSQL, and patch storage. Optional direct patch transfers reach remote storage without passing through the server. Juju manages VM and Kubernetes deployments; host administrators manage standalone snap deployments.</desc>
  <defs>
    <style>
      text { font-family: Ubuntu, Arial, sans-serif; font-size: 19px; fill: #333; }
      .heading { font-size: 21px; font-weight: bold; }
      .small { font-size: 17px; }
      .zone { fill: #f7f7f7; stroke: #772953; stroke-width: 2; stroke-dasharray: 8 6; }
      .box { fill: #fff; stroke: #888; stroke-width: 1.5; }
      .workload { fill: #d7e3dd; stroke: #7aa18d; stroke-width: 2; }
      .flow { fill: none; stroke: #333; stroke-width: 2; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #e95420; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#optional-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#333"/>
    </marker>
    <marker id="optional-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#e95420"/>
    </marker>
  </defs>
  <rect width="1200" height="850" fill="#fff"/>

  <rect class="zone" x="20" y="30" width="270" height="180" rx="8"/>
  <text class="heading" x="40" y="65">Client network</text>
  <rect class="box" x="40" y="95" width="230" height="85" rx="5"/>
  <text x="60" y="130">Livepatch Clients</text>
  <text class="small" x="60" y="160">Patch requests and reports</text>

  <rect class="zone" x="20" y="365" width="270" height="155" rx="8"/>
  <text class="heading" x="40" y="400">Administrator network</text>
  <rect class="box" x="40" y="425" width="230" height="65" rx="5"/>
  <text x="60" y="465">Livepatch Admin Tool</text>

  <rect class="zone" x="390" y="30" width="350" height="530" rx="8"/>
  <text class="heading" x="410" y="65">Server deployment</text>
  <rect class="box" x="410" y="100" width="310" height="110" rx="5"/>
  <text x="430" y="135">Ingress / reverse proxy</text>
  <text class="small" x="430" y="166">TLS termination when used</text>
  <text class="small" x="430" y="193">Operator-configured controls</text>

  <rect class="zone" x="410" y="290" width="310" height="210" rx="6"/>
  <text class="small" x="430" y="321">Snap or container boundary</text>
  <rect class="workload" x="430" y="345" width="270" height="120" rx="5"/>
  <text class="heading" x="450" y="380">Livepatch Server</text>
  <text class="small" x="450" y="411">HTTP APIs</text>
  <text class="small" x="450" y="441">Auth, validation, limits, logs</text>
  <path class="flow" d="M 565 210 V 345"/>
  <text class="small" x="575" y="242">HTTP</text>
  <text class="small" x="575" y="268">Trusted hop</text>

  <rect class="zone" x="860" y="30" width="320" height="285" rx="8"/>
  <text class="heading" x="880" y="65">Upstream services</text>
  <rect class="box" x="880" y="90" width="280" height="85" rx="5"/>
  <text x="900" y="123">Hosted Livepatch service</text>
  <text class="small" x="900" y="153">or upstream on-prem server</text>
  <rect class="box" x="880" y="205" width="280" height="80" rx="5"/>
  <text x="900" y="238">Ubuntu Pro service</text>
  <text class="small" x="900" y="266">or on-premises service</text>
  <rect class="zone" x="860" y="365" width="320" height="275" rx="8"/>
  <text class="heading" x="880" y="400">Data services</text>
  <rect class="box" x="880" y="425" width="280" height="70" rx="5"/>
  <text x="900" y="467">PostgreSQL</text>
  <rect class="box" x="880" y="535" width="280" height="75" rx="5"/>
  <text x="900" y="565">Patch storage</text>
  <text class="small" x="900" y="593">Filesystem, database or cloud</text>

  <path class="flow" d="M 270 135 H 410"/>
  <text class="small" x="308" y="123">APIs</text>
  <path class="flow" d="M 270 445 H 345 V 180 H 410"/>
  <text class="small" x="310" y="365" transform="rotate(-90 310 365)">Admin APIs</text>

  <path class="flow" d="M 700 365 H 780 V 130 H 880"/>
  <text class="small" x="791" y="117">Sync</text>
  <path class="flow" d="M 700 395 H 815 V 245 H 880"/>
  <text class="small" x="823" y="231">Tokens</text>
  <path class="flow" d="M 700 425 H 790 V 460 H 880"/>
  <text class="small" x="789" y="445">Database</text>
  <path class="flow" d="M 700 450 H 765 V 575 H 880"/>
  <text class="small" x="779" y="560">Patches</text>

  <path class="optional" d="M 270 165 H 320 V 650 H 1020 V 610"/>
  <path class="optional" d="M 270 475 H 320"/>
  <circle cx="320" cy="475" r="3" fill="#e95420"/>
  <text class="small" x="410" y="636">Optional direct patch transfers</text>

  <rect class="zone" x="390" y="700" width="350" height="110" rx="8"/>
  <text class="heading" x="410" y="735">Management context</text>
  <text class="small" x="410" y="765">Juju: VM and Kubernetes deployments</text>
  <text class="small" x="410" y="793">Host admins: standalone snap</text>
  <path class="flow" d="M 410 700 V 675 H 370 V 520 H 390"/>
  <text class="small" x="420" y="687">Manage</text>

  <rect class="zone" x="860" y="710" width="320" height="95" rx="8"/>
  <text class="heading" x="880" y="745">Observability context</text>
  <text class="small" x="880" y="778">Prometheus / Grafana / Loki</text>
  <path class="flow" d="M 700 465 H 750 V 755 H 860"/>
  <text class="small" x="761" y="696">Metrics / logs</text>

  <line class="zone" x1="30" y1="830" x2="90" y2="830"/>
  <text class="small" x="105" y="836">Trust boundary</text>
  <path class="flow" d="M 310 830 H 370"/>
  <text class="small" x="385" y="836">Service communication / management</text>
  <path class="optional" d="M 780 830 H 840"/>
  <text class="small" x="855" y="836">Optional direct transfer</text>
</svg>
